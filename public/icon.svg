<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.3" fill="none" />
  <!-- Stack Layers -->
  <g transform="translate(106, 120)">
    <!-- Layer 3 (Bottom) -->
    <path d="M0 160 L150 230 L300 160 L150 90 Z" fill="#4338ca" opacity="0.6"/>
    <path d="M0 160 L150 230 L150 250 L0 180 Z" fill="#3730a3" opacity="0.8"/>
    <path d="M300 160 L150 230 L150 250 L300 180 Z" fill="#312e81" opacity="0.8"/>

    <!-- Layer 2 (Middle) -->
    <path d="M0 90 L150 160 L300 90 L150 20 Z" fill="#6366f1" opacity="0.85"/>
    <path d="M0 90 L150 160 L150 180 L0 110 Z" fill="#4f46e5" opacity="0.95"/>
    <path d="M300 90 L150 160 L150 180 L300 110 Z" fill="#4338ca" opacity="0.95"/>

    <!-- Layer 1 (Top / Pulse) -->
    <path d="M0 20 L150 90 L300 20 L150 -50 Z" fill="url(#brandGrad)"/>
    <path d="M0 20 L150 90 L150 106 L0 36 Z" fill="#7c3aed"/>
    <path d="M300 20 L150 90 L150 106 L300 36 Z" fill="#6d28d9"/>

    <!-- Center Pulse Tracker Dot -->
    <circle cx="150" cy="20" r="14" fill="#ffffff" filter="drop-shadow(0 0 10px #67e8f9)"/>
  </g>
</svg>
