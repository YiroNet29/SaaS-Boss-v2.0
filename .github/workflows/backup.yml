name: Nightly database backup

on:
  schedule:
    - cron: '23 0 * * *' # 00:23 UTC = 03:23 in Addis Ababa
  workflow_dispatch: # "Run workflow" button for a manual backup

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      # Without its two secrets there is nothing to back up. Fail (red, and GitHub emails you) rather than
      # showing green every night while no backup is made.
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::No backup was made: the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets aren't set. See README > Backups."
            exit 1
          fi

      - uses: actions/checkout@v7

      # pg_dump must be at least as new as the database server, so use the PostgreSQL 17 client.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        run: bash scripts/backup-db.sh backup

      # The repo is public, so the file is encrypted before it leaves the runner.
      - name: Store encrypted backup (kept 30 days)
        uses: actions/upload-artifact@v7
        with:
          name: stacktrack-db-backup-${{ github.run_number }}
          path: backup/*.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  # The receipt photos and PDFs live in Supabase Storage, not in the database dump.
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::No receipt files were backed up: the SUPABASE_DB_URL, SUPABASE_SERVICE_ROLE_KEY and BACKUP_PASSPHRASE repository secrets must all be set. See README > Backups."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download and encrypt the receipt files
        run: node scripts/backup-receipts.mjs backup backup

      - name: Store encrypted receipt files (kept 30 days)
        uses: actions/upload-artifact@v7
        with:
          name: stacktrack-receipts-backup-${{ github.run_number }}
          path: backup/*.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
